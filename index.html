<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171918">
  <meta name="description" content="生成可审查的一行 PowerShell 命令，使用当前用户 SSH key 扫描 IPv4 /24 网段并输出终端表格。">
  <meta property="og:title" content="SSH Command Scanner">
  <meta property="og:description" content="自定义 SSH 命令模板，一次扫描一个 IPv4 /24 网段。">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>SSH Command Scanner</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="SSH Command Scanner 首页">
      <img src="assets/mark.svg" width="28" height="28" alt="">
      <span>SSH Command Scanner</span>
    </a>
    <nav aria-label="项目链接">
      <a href="https://github.com/guajun/ssh-command-scanner">GitHub</a>
      <a href="https://github.com/guajun/ssh-command-scanner/releases/latest">Release</a>
    </nav>
  </header>

  <main>
    <section class="builder-band" aria-labelledby="page-title">
      <div class="shell">
        <p class="eyebrow">WINDOWS · OPENSSH · POWERSHELL 5.1+</p>
        <h1 id="page-title">SSH 网段扫描器</h1>
        <p class="lede">填写 SSH 命令模板，生成一条可直接运行的 PowerShell 命令。</p>

        <form id="command-form" class="command-form">
          <div class="field-grid">
            <label class="field">
              <span>SSH 用户名 <small>留空则运行时询问</small></span>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="young" spellcheck="false">
            </label>
            <label class="field field-wide">
              <span>SSH 命令模板</span>
              <input id="template" name="template" type="text" value="ssh {user}@10.30.3.x" spellcheck="false" required>
            </label>
          </div>

          <details class="advanced">
            <summary>扫描参数</summary>
            <div class="number-grid">
              <label class="field">
                <span>起始地址</span>
                <input id="start-host" type="number" min="0" max="255" value="1">
              </label>
              <label class="field">
                <span>结束地址</span>
                <input id="end-host" type="number" min="0" max="255" value="254">
              </label>
              <label class="field">
                <span>超时（秒）</span>
                <input id="timeout" type="number" min="1" max="60" value="3">
              </label>
              <label class="field">
                <span>并发数</span>
                <input id="throttle" type="number" min="1" max="128" value="32">
              </label>
              <label class="field field-full">
                <span>ASCII 表格文件 <small>可选，仅支持 .txt</small></span>
                <input id="text-output" type="text" placeholder="C:\Temp\ssh-scan.txt" spellcheck="false">
              </label>
            </div>
          </details>

          <div class="command-output" aria-live="polite">
            <div class="command-meta">
              <span>生成的命令</span>
              <span id="validation-status" class="validation-status">模板有效</span>
            </div>
            <code id="generated-command"></code>
            <button id="copy-button" class="copy-button" type="button" title="复制生成的 PowerShell 命令">
              <span class="copy-symbol" aria-hidden="true">⧉</span>
              <span id="copy-label">复制命令</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="status-band" aria-labelledby="status-title">
      <div class="shell status-layout">
        <div>
          <p class="section-kicker">OUTPUT</p>
          <h2 id="status-title">一次连接，一张终端表格</h2>
        </div>
        <div class="status-list" role="list" aria-label="扫描状态">
          <span role="listitem"><i class="dot dot-green"></i>密钥登录成功</span>
          <span role="listitem"><i class="dot dot-amber"></i>服务可达，认证失败</span>
          <span role="listitem"><i class="dot dot-red"></i>拒绝或不可达</span>
          <span role="listitem"><i class="dot dot-gray"></i>结果不确定</span>
        </div>
        <div class="target-preview" aria-label="目标预览">
          <div class="terminal-bar">
            <span>目标预览</span>
            <span id="target-count">254 hosts</span>
          </div>
          <ol id="target-preview-list"></ol>
        </div>
      </div>
    </section>

    <section class="links-band" aria-label="下载与校验">
      <div class="shell link-row">
        <a href="scan.ps1" download>下载 scan.ps1</a>
        <a href="https://github.com/guajun/ssh-command-scanner/releases/latest">Release 与 SHA-256</a>
        <span>MIT License</span>
      </div>
    </section>
  </main>

  <footer>
    <span>SSH Command Scanner</span>
    <span>密钥始终保留在本机</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
